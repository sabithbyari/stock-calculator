<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Average Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f0f11;--surface:#18181c;--surface2:#22222a;--border:#2e2e38;
    --text:#f0f0f4;--muted:#8888a0;--accent:#7c6ef7;--accent2:#4fd1a5;
    --danger:#f87171;--success:#4ade80;--warning:#fbbf24;
    --radius:10px;--radius-lg:16px;
  }
  html{font-size:16px}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 60px}

  header{padding:32px 24px 24px;max-width:820px;margin:0 auto}
  header h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#7c6ef7,#4fd1a5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--muted);font-size:14px;margin-top:6px}

  .container{max-width:820px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:16px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px}
  .card-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}

  .lot-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=number]{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;padding:9px 12px;width:100%;outline:none;-moz-appearance:textfield;font-family:'Inter',sans-serif}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  input[type=number]:focus{border-color:var(--accent)}
  input[readonly]{color:var(--muted);cursor:default}

  button.icon-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);width:38px;height:38px;cursor:pointer;color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.15s}
  button.icon-btn:hover{background:#3a1a1a;border-color:var(--danger);color:var(--danger)}
  button.add-btn{background:transparent;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-size:13px;padding:8px 16px;cursor:pointer;transition:.15s;font-family:'Inter',sans-serif}
  button.add-btn:hover{border-color:var(--accent);color:var(--accent)}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.row2{grid-template-columns:1fr}.lot-row{grid-template-columns:1fr 1fr auto}}

  .cmp-note{font-size:12px;padding-top:6px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

  .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:start}
  .compare-col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px}
  .compare-col.after{border-color:var(--accent);background:rgba(124,110,247,.06)}
  .compare-divider{display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:22px;color:var(--muted);align-self:center}
  .col-head{font-size:13px;font-weight:500;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px}
  .col-head .dot-sm{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .col-head .dot-sm.after{background:var(--accent2)}

  .mrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none}
  .mlbl{font-size:12px;color:var(--muted)}
  .mval{font-size:13px;font-weight:500;color:var(--text)}
  .profit{color:var(--success)}
  .loss{color:var(--danger)}

  .impact-section .card-label{margin-bottom:0}
  .imp-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
  .imp-row:last-child{border-bottom:none}
  .imp-left .imp-title{font-size:13px;font-weight:500;color:var(--text)}
  .imp-left .imp-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .imp-left .imp-note{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
  .badge.good{background:rgba(74,222,128,.15);color:var(--success)}
  .badge.bad{background:rgba(248,113,113,.15);color:var(--danger)}
  .badge.neu{background:var(--surface2);color:var(--muted)}

  .formula-box{background:var(--surface2);border-radius:var(--radius);padding:14px 16px;font-size:12px;color:var(--muted);line-height:1.8;border-left:3px solid var(--accent)}
  .formula-box strong{color:var(--text)}

  #hidden-section{display:none}
  .section-divider{height:1px;background:var(--border);margin:4px 0}
</style>
</head>
<body>

<header>
  <h1>Stock Average Calculator</h1>
  <p>See exactly how buying more shares changes your average price, P&amp;L and returns — before vs after.</p>
</header>

<div class="container">

  <!-- Holdings -->
  <div class="card">
    <div class="card-label">Your current holdings</div>
    <div id="lots"></div>
    <button class="add-btn" onclick="addLot()">+ Add another lot</button>
  </div>

  <!-- New buy + CMP -->
  <div class="card">
    <div class="card-label">New buy to average</div>
    <div class="row2" style="margin-bottom:14px">
      <div class="field"><label>Buy price (₹)</label><input type="number" id="np" placeholder="e.g. 450" min="0" oninput="calc()"/></div>
      <div class="field"><label>Quantity</label><input type="number" id="nq" placeholder="e.g. 20" min="0" oninput="calc()"/></div>
    </div>
    <div class="section-divider"></div>
    <div style="margin-top:14px">
      <div class="field"><label>Current Market Price — CMP (₹)</label><input type="number" id="cmp" placeholder="e.g. 480" min="0" oninput="calc()"/></div>
      <div class="cmp-note" id="cmp-note" style="display:none">
        <span class="dot" id="cmp-dot"></span>
        <span id="cmp-text" style="color:var(--muted)"></span>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="hidden-section">

    <!-- Before vs After -->
    <div class="compare">
      <div class="compare-col before">
        <div class="col-head"><span class="dot-sm"></span> Before new buy</div>
        <div id="b-metrics"></div>
      </div>
      <div class="compare-divider">→</div>
      <div class="compare-col after">
        <div class="col-head"><span class="dot-sm after"></span> After new buy</div>
        <div id="a-metrics"></div>
      </div>
    </div>

    <!-- Impact -->
    <div class="card impact-section">
      <div class="card-label" style="margin-bottom:4px">Impact of new buy</div>
      <div id="impact"></div>
    </div>

    <!-- Formula box -->
    <div class="formula-box" id="formula"></div>

  </div>

</div>

<script>
let lots=[],uid=0;
function addLot(p='',q=''){lots.push({id:uid++,p,q});render();}
function removeLot(id){lots=lots.filter(l=>l.id!==id);render();}
function upd(id,f,v){const l=lots.find(x=>x.id===id);if(l)l[f]=v;calc();}
function render(){
  const c=document.getElementById('lots');c.innerHTML='';
  lots.forEach((l,i)=>{
    const d=document.createElement('div');d.className='lot-row';
    d.innerHTML=`<div class="field"><label>Buy price (₹)</label><input type="number" min="0" placeholder="e.g. 500" value="${l.p}" oninput="upd(${l.id},'p',this.value)"/></div>
    <div class="field"><label>Qty</label><input type="number" min="0" placeholder="e.g. 10" value="${l.q}" oninput="upd(${l.id},'q',this.value)"/></div>
    ${lots.length>1?`<button class="icon-btn" onclick="removeLot(${l.id})" title="Remove">×</button>`:'<div></div>'}`;
    c.appendChild(d);
  });calc();
}
function inr(n){return'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function pct(n){return(n>=0?'+':'')+n.toFixed(2)+'%';}
function sign(n){return n>=0?'+':'-';}
function mrow(lbl,val,cls=''){return`<div class="mrow"><span class="mlbl">${lbl}</span><span class="mval ${cls}">${val}</span></div>`;}
function badge(diff,lowerGood){
  if(Math.abs(diff)<0.001)return`<span class="badge neu">no change</span>`;
  const good=lowerGood?diff<0:diff>0;
  const arrow=good?'↑':'↓';
  const disp=Math.abs(diff)>=1?inr(Math.abs(diff)):Math.abs(diff).toFixed(2);
  return`<span class="badge ${good?'good':'bad'}">${arrow} ${disp}</span>`;
}
function calc(){
  let amt=0,qty=0;
  lots.forEach(l=>{const p=parseFloat(l.p)||0,q=parseFloat(l.q)||0;amt+=p*q;qty+=q;});
  const cmp=parseFloat(document.getElementById('cmp').value)||0;
  const np=parseFloat(document.getElementById('np').value)||0;
  const nq=parseFloat(document.getElementById('nq').value)||0;

  const noteEl=document.getElementById('cmp-note');
  const dotEl=document.getElementById('cmp-dot');
  const txtEl=document.getElementById('cmp-text');
  if(qty&&amt&&cmp){
    const a=amt/qty;
    noteEl.style.display='flex';
    if(cmp>a){dotEl.style.background='#4ade80';txtEl.textContent=`CMP is above your avg ₹${a.toFixed(2)} — currently in profit`;}
    else if(cmp<a){dotEl.style.background='#f87171';txtEl.textContent=`CMP is below your avg ₹${a.toFixed(2)} — currently in loss`;}
    else{dotEl.style.background='#fbbf24';txtEl.textContent=`CMP equals your avg ₹${a.toFixed(2)} — break even`;}
  } else noteEl.style.display='none';

  const sec=document.getElementById('hidden-section');
  if(!qty||!amt||!cmp||!np||!nq){sec.style.display='none';return;}
  sec.style.display='block';

  const bAvg=amt/qty,bPnl=(cmp-bAvg)*qty,bPct=((cmp-bAvg)/bAvg)*100,bInv=amt,bVal=cmp*qty;
  const aAmt=amt+np*nq,aQty=qty+nq,aAvg=aAmt/aQty,aPnl=(cmp-aAvg)*aQty,aPct=((cmp-aAvg)/aAvg)*100,aInv=aAmt,aVal=cmp*aQty;

  document.getElementById('b-metrics').innerHTML=
    mrow('Avg buy price','₹'+bAvg.toFixed(2))+
    mrow('Total shares',qty.toLocaleString())+
    mrow('Total invested',inr(bInv))+
    mrow('Current value',inr(bVal))+
    mrow('P&L',sign(bPnl)+inr(bPnl),bPnl>=0?'profit':'loss')+
    mrow('Return',pct(bPct),bPnl>=0?'profit':'loss');

  document.getElementById('a-metrics').innerHTML=
    mrow('Avg buy price','₹'+aAvg.toFixed(2))+
    mrow('Total shares',aQty.toLocaleString())+
    mrow('Total invested',inr(aInv))+
    mrow('Current value',inr(aVal))+
    mrow('P&L',sign(aPnl)+inr(aPnl),aPnl>=0?'profit':'loss')+
    mrow('Return',pct(aPct),aPnl>=0?'profit':'loss');

  const rows=[
    {t:'Average price',sub:`${inr(bAvg)} → ${inr(aAvg)}`,note:aAvg<bAvg?'Averaging down — break-even is now easier':'Averaging up — you expect further upside',diff:aAvg-bAvg,low:true},
    {t:'P&L (absolute ₹)',sub:`${sign(bPnl)}${inr(bPnl)} → ${sign(aPnl)}${inr(aPnl)}`,note:'More shares × new avg vs CMP',diff:aPnl-bPnl,low:false},
    {t:'Return %',sub:`${pct(bPct)} → ${pct(aPct)}`,note:'Best indicator of whether averaging helped',diff:aPct-bPct,low:false},
    {t:'Extra capital needed',sub:`—  →  ${inr(np*nq)}`,note:'New money going in',diff:0,low:false},
    {t:'Break-even price',sub:`₹${bAvg.toFixed(2)} → ₹${aAvg.toFixed(2)}`,note:'Stock must cross this for you to be in profit',diff:aAvg-bAvg,low:true},
  ];

  document.getElementById('impact').innerHTML=rows.map(r=>`
    <div class="imp-row">
      <div class="imp-left">
        <div class="imp-title">${r.t}</div>
        <div class="imp-sub">${r.sub}</div>
        <div class="imp-note">${r.note}</div>
      </div>
      <div style="padding-left:12px;flex-shrink:0;padding-top:2px">${r.diff!==0?badge(r.diff,r.low):''}</div>
    </div>`).join('');

  document.getElementById('formula').innerHTML=
    `<strong>How P&L is calculated:</strong><br>` +
    `Before → (${cmp} − ${bAvg.toFixed(2)}) × ${qty} shares = <strong>${sign(bPnl)}${inr(bPnl)}</strong><br>`+
    `After &nbsp;→ (${cmp} − ${aAvg.toFixed(2)}) × ${aQty} shares = <strong>${sign(aPnl)}${inr(aPnl)}</strong><br><br>`+
    `P&L changes because two things shift: your avg price (${bAvg.toFixed(2)} → ${aAvg.toFixed(2)}) and your share count (${qty} → ${aQty}).`;
}
addLot();addLot();
</script>
</body>
</html>
